name: Day 14 quality gate

on:
  pull_request:
    paths:
      - "06-lab-complete/benchmark-observability/develop/**"
      - "reports/eval_v2.json"
      - ".github/workflows/day14-quality-gate.yml"
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Evaluate v2 and gate accuracy
        run: |
          AGENT_VERSION=v2 PORT=8002 python app.py > /tmp/day14-agent.log 2>&1 &
          agent_pid=$!
          trap 'kill "$agent_pid" 2>/dev/null || true' EXIT
          healthy=0
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8002/health > /dev/null; then
              healthy=1
              break
            fi
            sleep 1
          done
          if [ "$healthy" -ne 1 ]; then
            cat /tmp/day14-agent.log
            exit 1
          fi
          python eval/run_eval.py \
            --url http://127.0.0.1:8002 \
            --baseline ../../../reports/eval_v2.json \
            --min-accuracy 1.0 \
            --out ../../../reports/eval_ci.json

# Lab deployment contract. Build from service root /06-lab-complete.
# The Dockerfile CMD expands PORT and execs uvicorn; do not override it.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
